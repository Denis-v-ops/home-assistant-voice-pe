name: Build

on:
  push:
    branches:
      - dev
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-wake-audio:
    name: Validate wake audio mastering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Check format, loudness, true peak, and clipping
        run: python scripts/validate_wake_audio.py

  build-firmware:
    name: Validate Realtime firmware
    uses: esphome/workflows/.github/workflows/build.yml@2026.7.3
    with:
      # This overlay supplies non-production credentials and Wi-Fi solely so
      # CI can compile the otherwise dashboard-managed configuration.
      files: .github/ci/home-assistant-voice.yaml
      esphome-version: 2026.7.3
