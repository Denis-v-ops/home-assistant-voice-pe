name: Build

on:
  push:
    branches:
      - dev
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-firmware:
    name: Validate Realtime firmware
    uses: esphome/workflows/.github/workflows/build.yml@2026.7.0
    with:
      # This overlay supplies non-production credentials and Wi-Fi solely so
      # CI can compile the otherwise dashboard-managed configuration.
      files: .github/ci/home-assistant-voice.yaml
      esphome-version: 2026.7.0
